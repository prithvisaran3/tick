name: ci
on:
  push:
  pull_request:
# Least privilege: every job only reads the repo. Third-party actions are pinned by commit SHA (tag in the comment).
permissions:
  contents: read
jobs:
  secrets:
    # Fails the build if anything that looks like a secret is in the tree or ANYWHERE in history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: python3 tools/secret_scan.py --tree
      - run: python3 tools/secret_scan.py --history
      - run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then echo ".env file committed"; exit 1; fi
  migrations:
    # Every migration + the RLS and totals tests on a throwaway Postgres (no Supabase project, no secrets).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-contrib-16
      - run: sudo -E python3 tools/local_db.py test
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install pip-audit && pip-audit -r api/requirements.txt
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: python3 tools/contrast_check.py
      - run: python3 tools/gen_tokens.py && python3 tools/compile_ahap.py && git diff --exit-code app/lib/design app/assets/haptics
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install -r api/requirements-dev.txt
      - run: cd api && python -m pytest -q
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295  # v2.22.0
        with: { flutter-version: "3.44.9", channel: stable }
      - run: cd app && flutter pub get && flutter analyze && flutter test
  rls:
    # Needs repo secrets SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF; skipped when absent.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "no secrets; skipping"; else python3 tools/run_rls_tests.py; fi
  integration:
    # Live checks (Supabase, Plaid sandbox, OpenRouter) run only when the secrets exist; otherwise this job is a no-op.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLAID_SANDBOX_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then echo "no secrets; skipping integration checks"; exit 0; fi
          pip install -r api/requirements-dev.txt
          python3 tools/e2e_ingest.py
          python3 tools/e2e_plaid_sandbox.py
